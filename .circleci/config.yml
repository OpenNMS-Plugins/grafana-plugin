version: 2.1

executors:

  # Builds the RPM. opennms/build-env has no current RHEL-family tag -- the last one
  # was CentOS 8 with Node 16, both long EOL -- so this tracks Rocky Linux 9 and
  # installs the build tooling in the job. Nothing here needs a JDK.
  rpm-build-executor:
    docker:
      - image: rockylinux/rockylinux:9

  # Builds the DEB. The old opennms/build-env:debian-jdk11 tag was Debian 11
  # (bullseye) with Node 18, which is older than this plugin's engines range
  # (>=22 <25). The official Node image on Debian 13 (trixie) gives us Node 22 and
  # dpkg out of the box; debhelper is installed in the job.
  deb-build-executor:
    docker:
      - image: node:22-trixie

  node-executor:
    docker:
      - image: cimg/node:22.23.2

orbs:
  cloudsmith: cloudsmith/cloudsmith@1.0.4
  sign-packages: opennms/sign-packages@3.0.1

defaults: &defaults
  parameters:
    from_branch:
      description: the auto-merge source branch
      type: string
      default: develop
    to_branch:
      description: the auto-merge target branch
      type: string
      default: master

docker_container_config: &docker_container_config
  executor: node-executor

commands:
  docker-registry-login:
    description: "Connect to Docker Registry"
    steps:
      - run:
          name: DockerHub Login
          command: |
            docker login -u ${DOCKERHUB_LOGIN} -p ${DOCKERHUB_PASS}
  generate-node-cache-checksum:
    steps:
      - run:
          name: Generate Node Package Checksum
          command: |
            cat package-lock.json | jq '.packages | with_entries(select(.key != ""))' > /tmp/filtered-package-lock.json
  install-node-dependencies:
    steps:
      - generate-node-cache-checksum
      - restore_cache:
          name: Restore NPM Cache
          keys:
            - npm-packages-v4-{{ arch }}-{{ checksum "/tmp/filtered-package-lock.json" }}-{{ .Branch }}-{{ .Revision }}
            - npm-packages-v4-{{ arch }}-{{ checksum "/tmp/filtered-package-lock.json" }}-{{ .Branch }}
            - npm-packages-v4-{{ arch }}-{{ checksum "/tmp/filtered-package-lock.json" }}-
            - npm-packages-v4-{{ arch }}-
      - run:
          name: Install Dependencies
          command: |
            npm --no-progress ci --include=optional
            # Ensure platform-specific SWC binary is installed
            SWC_ARCH="$(node -p "process.arch")"
            SWC_PLATFORM="$(node -p "process.platform")"
            if [ "$SWC_PLATFORM" = "linux" ]; then
              SWC_PKG="@swc/core-linux-${SWC_ARCH}-gnu"
              echo "Installing ${SWC_PKG}..."
              npm install "${SWC_PKG}" --save-optional --ignore-scripts
            fi
  save-node-cache:
    steps:
      - generate-node-cache-checksum
      - run:
          name: Clean Old Cache Entries
          command: |
              if [ -d ~/.npm ]; then
                find ~/.npm -maxdepth 2 -type d -ctime +14 -exec rm -rf {} \;
              fi
      - save_cache:
          name: Save Package Cache
          key: npm-packages-v4-{{ arch }}-{{ checksum "/tmp/filtered-package-lock.json" }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.npm
  validate-schema:
    steps:
      - run:
          name: Validate Plugin Schema
          command: |
            export PATH="./node_modules/.bin:${PATH}"
            curl -L -o /tmp/plugin.schema.json https://raw.githubusercontent.com/grafana/grafana/master/docs/sources/developers/plugins/plugin.schema.json
            sudo apt-get update
            sudo apt-get -y --no-install-recommends install python3-pip
            pip3 install --break-system-packages check-jsonschema
            # the plugin.schema.json uses 'python' regex format, including backslashes before '-' and '%'
            check-jsonschema --regex-variant python --schemafile /tmp/plugin.schema.json src/plugin.json
  build-and-sign:
    steps:
      - run:
          name: Run Build and Sign
          command: |
            export PATH="./node_modules/.bin:${PATH}"
            export NODE_OPTIONS=--openssl-legacy-provider
            npm run build
            npm run sign

            curl -L -o /tmp/release-lint.sh https://raw.githubusercontent.com/OpenNMS/opennms-repo/master/script/release-lint.sh
            chmod 755 /tmp/release-lint.sh

            LINT_WARN_ONLY=1
            if [ -n "${CIRCLE_TAG}" ]; then
              LINT_WARN_ONLY=0
            fi
            case "${CIRCLE_BRANCH}" in
              main-*)
                LINT_WARN_ONLY=0
                ;;
            esac

            if [ "${LINT_WARN_ONLY}" -eq 1 ]; then
              /tmp/release-lint.sh -w
            else
              /tmp/release-lint.sh
            fi

            unset NODE_OPTIONS
            
jobs:
  pre-build:
    executor: node-executor
    resource_class: small
    steps:
      - checkout
      - run:
          name: Get version number
          command: ./get-version.sh
      - persist_to_workspace:
          root: ~/
          paths:
            - project
  build:
    executor: node-executor
    resource_class: large
    steps:
      - attach_workspace:
          at: ~/
      - add_ssh_keys:
          fingerprints:
            - "66:40:61:8c:3b:99:12:df:00:ea:68:a3:61:d1:90:49"
      - run:
          name: Set Up Github Host Key
          command: |
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
              echo "|1|+eDL4BFAY1JfZjrxrJX0cahBtVU=|g91UxzJnqBKdJvCxPmTD59vtPV4= ssh-rsa " >> ~/.ssh/known_hosts
              echo "|1|SZ/U1VP2X+BY4ewvW3j9yIQDXTU=|34DiVLA+NU6P9Acg0Fk5LSbxIdg= ssh-rsa " >> ~/.ssh/known_hosts
              echo "|1|jopvDXD+uqD0jpXcT1YtIRhc8jQ=|KkoqYK0ZpHiiNZE6GBiYlI3cRmQ= ssh-rsa " >> ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
      - install-node-dependencies
      - validate-schema
      - build-and-sign
      - save-node-cache
      # This job used to store_test_results and store_artifacts from coverage/, but it
      # never ran the tests and jest was never asked for coverage, so the directory did
      # not exist. The unit tests and their JUnit output live in the `verify` job now.
      - persist_to_workspace:
          root: ~/
          paths:
            - project

  verify:
    # The unit tests do not need dist: the packaging specs build their own fixture tree
    # under the system temp directory, and the rest are plain unit tests. So this runs in
    # parallel with `build` off `pre-build` rather than queueing behind it, the same way
    # `build-docs` does, and costs no wall-clock on the critical path.
    executor: node-executor
    resource_class: medium
    steps:
      - attach_workspace:
          at: ~/
      # `build` owns the cache write; this job only restores, as `build-docs` does.
      - install-node-dependencies
      - run:
          name: Install the packaging test toolchain
          command: |
            # deb_build.spec.ts and rpm_build.spec.ts drive dpkg-buildpackage and
            # rpmbuild end to end, and skip themselves when the tools are absent.
            #
            # build-essential/debhelper/fakeroot: the list make-deb installs. cimg/node
            # is Ubuntu-based and already carries dpkg-buildpackage, so the deb suite
            # does not skip here -- but without these it cannot finish the build.
            #
            # rpm: provides rpmbuild on Ubuntu, which is otherwise absent. These specs
            # cover our spec template and build script -- package naming, metadata,
            # install paths, ownership, Requires, fixture exclusion -- none of which
            # turn on the rpm version, so testing against Ubuntu's 4.18 rather than
            # el9's 4.16 is not worth a second job on rpm-build-executor. Revisit if an
            # assertion ever depends on rpmbuild's own behaviour.
            #
            # apt skips whatever the image already has.
            sudo apt-get update
            sudo apt-get -y --no-install-recommends install build-essential debhelper fakeroot rpm
      - run:
          name: Run unit tests
          command: npm run test:ci
      # Ordered before the lint step, and `when: always` on both, so the report survives
      # a failure either side of it. CircleCI skips remaining steps once one fails, and
      # while store_artifacts is documented as implicitly always and store_test_results
      # is observed to upload from a failed job, neither is worth depending on silently:
      # a failing suite is exactly when the report matters most.
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: test-results
          when: always
      - run:
          name: Run ESLint
          command: npm run lint

  build-docs:
    # Antora comes from this repo's own @antora devDependencies, not from an image.
    # opennms/antora is Alpine 3.18 on Node 16 in every tag, newest included, and
    # Antora 3.2 requires Node >= 20, so that image can no longer run it at all: the
    # CLI resolves @antora/site-generator from the playbook directory, loaded the
    # repo's copy, and died in its pino dependency.
    executor: node-executor
    steps:
      - attach_workspace:
          at: ~/
      # Antora is a devDependency now, and this job requires only pre-build, which
      # checks out but never installs. The old opennms/antora image carried Antora
      # globally so the workspace contents did not matter; using this repo's own copy
      # means they do. Installing here rather than adding `requires: build` keeps the
      # docs building in parallel with the plugin instead of queueing behind it.
      - install-node-dependencies
      - run:
          name: Validate Xrefs in docs
          command: |
            # validate-xrefs installs @antora/xref-validator itself: it is not on
            # npmjs.org, only a GitLab tarball, so it cannot be a devDependency. The
            # pinned commit lives in package.json so CI and a local run stay identical.
            npm run validate-xrefs
      - run:
          name: Generate HTML output for documentation
          command: |
            npm run docs
      - run:
          name: Validate anchors in the generated docs
          command: |
            # Antora validates the page half of an xref target and never the #anchor
            # half, so this reads the site npm run docs just built and has to follow it.
            npm run validate-anchors
      - store_artifacts:
          path: build/site.zip
          destination: site.zip

      - persist_to_workspace:
          root: ~/
          paths:
            - project/public
            - project/build

  create-merge-branch:
    <<: *defaults
    <<: *docker_container_config
    resource_class: medium+
    steps:
      - add_ssh_keys:
          fingerprints:
            - "66:40:61:8c:3b:99:12:df:00:ea:68:a3:61:d1:90:49"
      - checkout
      - run:
          name: Create git identity
          command: |
            git config user.email "cicd-system@opennms.com"
            git config user.name "CI/CD System"
      - run:
          name: Checkout target branch and merge from source
          command: |
            export GIT_MERGE_AUTOEDIT=no
            git checkout "<< parameters.to_branch >>"
            git pull
            git merge "origin/<< parameters.from_branch >>"
      - install-node-dependencies
      - build-and-sign
      - run:
          name: Commit and push to github
          command: |
            export GIT_MERGE_AUTOEDIT=no
            if [ "${CIRCLE_BRANCH}" = "develop" ]; then
              # publish generated dist/ to master
              git add -A --force dist
              git commit -a --no-verify -m "autogenerated runtime build artifacts"
              git push --no-verify origin "<< parameters.to_branch >>:<< parameters.to_branch >>"
            fi

  make-tarball:
    executor: node-executor
    resource_class: small
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Create plugin tarball
          command: |
            mkdir -p ./artifacts
            cd dist
            tar --exclude='test' \
              -czf "../artifacts/opennms-grafana-plugin_$(../.circleci/get-version.sh).tar.gz" .
      - store_artifacts:
          path: ~/project/artifacts
      - persist_to_workspace:
          root: ~/
          paths:
            - ./project/artifacts
            - ./project/package.json
            - ./project/version.tag

  make-zip:
    executor: node-executor
    resource_class: small
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Create Plugin ZIP File
          command: |
            npm run package:zip
      - store_artifacts:
          path: ./artifacts
      - persist_to_workspace:
          root: ~/
          paths:
            - ./project/artifacts

  make-docker-image:
    executor: node-executor
    resource_class: small
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: ~/
      - run:
          name: Add GitHub to known_hosts
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Build Docker Image
          command: |
            echo "version: $(.circleci/get-version.sh)"
            docker build \
              --build-arg GRAFANA_VERSION=$(cat grafana.version) \
              -t grafana-plugin:$(.circleci/get-version.sh) .
      - run:
          name: Export Docker Image as Artifact
          command: |
            mkdir -p artifacts
            docker image save grafana-plugin:$(.circleci/get-version.sh) -o artifacts/opennms-grafana-plugin.oci
      - store_artifacts:
          path: ./artifacts
      - persist_to_workspace:
          root: ~/
          paths:
            - ./project/artifacts
  make-rpm:
    executor: rpm-build-executor
    resource_class: small
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Install RPM build tooling
          command: |
            # Rocky 9 carries no node; rpm-sign comes from the orb step below. tar,
            # which the spec's %setup shells out to, is in the base image and is a
            # declared dependency of rpm-build, so it does not need listing here.
            dnf -y module enable nodejs:22
            dnf -y --setopt=install_weak_deps=False install nodejs npm rpm-build
      - sign-packages/install-rpm-dependencies:
          skip_if_forked_pr: true
      - sign-packages/setup-env:
          skip_if_forked_pr: true
      - run:
          name: Create RPM package
          command: |
            RELEASE="0.$(.circleci/get-version.sh | cut -d- -f2-)"
            if [ "$(grep -c -- -SNAPSHOT package.json)" -eq 0 ]; then
              RELEASE=1
            fi
            npm run package:rpm -- --release "$RELEASE"
      - sign-packages/sign-rpms:
          skip_if_forked_pr: true
          gnupg_key: opennms@opennms.org
          packages: artifacts/*.rpm
      - store_artifacts:
          path: ./artifacts
      - persist_to_workspace:
          root: ~/
          paths:
            - ./project/artifacts

  make-deb:
    executor: deb-build-executor
    resource_class: small
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Install DEB build tooling
          command: |
            # This apt-get update is also what makes the orb step below work. Debian 13
            # ships its sources as deb822 in /etc/apt/sources.list.d/debian.sources and
            # has no /etc/apt/sources.list at all, and the orb pins
            # -o Dir::Etc::sourcelist=sources.list -o Dir::Etc::sourceparts=- so on its
            # own it refreshes nothing and cannot find gnupg2 or debsigs. It passes
            # -o APT::Get::List-Cleanup=0, so the lists this leaves behind survive.
            apt-get update
            apt-get -y --no-install-recommends install build-essential debhelper fakeroot
      - sign-packages/install-deb-dependencies:
          skip_if_forked_pr: true
      - sign-packages/setup-env:
          skip_if_forked_pr: true
      - run:
          name: Create DEB package
          command: |
            RELEASE="0.$(.circleci/get-version.sh | cut -d- -f2-)"
            if [ "$(grep -c -- -SNAPSHOT package.json)" -eq 0 ]; then
              RELEASE=1
            fi
            npm run package:deb -- --release "$RELEASE"
      - sign-packages/sign-debs:
          skip_if_forked_pr: true
          gnupg_key: opennms@opennms.org
          packages: artifacts/*.deb
      - store_artifacts:
          path: ./artifacts
      - persist_to_workspace:
          root: ~/
          paths:
            - ./project/artifacts

  validate-packages:
    executor: node-executor
    resource_class: small
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: ~/
      - run:
          name: Validate plugin ZIP file
          command: npx -y '@grafana/plugin-validator@latest' -sourceCodeUri "file://$(pwd)" -strict -config .circleci/grafana-plugin-validator-config.yaml artifacts/opennms-grafana-plugin-*.zip
      - run:
          name: Validate Docker image
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/bin
      - run:
          name: Scan the local image with trivy
          command: |
            IMAGE_NAME="$(docker image load -q -i artifacts/*.oci | awk '{ print $NF }')"
            # Table result includes only package filenames. Use '--format json' option to get the full path to the package file.
            /tmp/bin/trivy image \
              --ignorefile .circleci/trivy-config/trivyignore \
              --timeout 30m \
              --exit-code 0 \
              --format json \
              -o /tmp/report.json \
              --no-progress \
              "${IMAGE_NAME}"

  publish-docker-image-latest:
    executor: node-executor
    resource_class: small
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: ~/
      - docker-registry-login
      - run:
          name: Load Docker Container Image file
          command: |
            docker image load -q -i ./artifacts/opennms-grafana-plugin.oci | grep 'Loaded image:' | cut -d: -f2- | xargs > ./opennms-grafana-plugin-docker-image-name.txt
      - run:
          name: Set DockerHub organization and ensure lower case
          command: |
            if [ -z ${DOCKERHUB_PROJECT_USER+x} ]; then
                DOCKERHUB_PROJECT_USER=$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]')
                echo "export DOCKERHUB_PROJECT_USER=${DOCKERHUB_PROJECT_USER}" >> ${BASH_ENV}
                echo "Use CIRCLE_PROJECT_USERNAME instead which is set to ${DOCKERHUB_PROJECT_USER}."
            else
                DOCKERHUB_PROJECT_USER=$(echo "${DOCKERHUB_PROJECT_USER}" | tr '[:upper:]' '[:lower:]')
                echo "export DOCKERHUB_PROJECT_USER=${DOCKERHUB_PROJECT_USER}" >> ${BASH_ENV}
                echo "Overwrite DOCKERHUB_PROJECT_USER with ${DOCKERHUB_PROJECT_USER}."
            fi
      - run:
          name: Set DockerHub project name and ensure lower case
          command: |
            if [ -z ${DOCKERHUB_PROJECT_NAME+x} ]; then
                DOCKERHUB_PROJECT_NAME=$(echo "${CIRCLE_PROJECT_REPONAME}" | tr '[:upper:]' '[:lower:]')
                echo "export DOCKERHUB_PROJECT_NAME=${DOCKERHUB_PROJECT_NAME}" >> ${BASH_ENV}
                echo "Use CIRCLE_PROJECT_REPONAME instead which is set to ${DOCKERHUB_PROJECT_NAME}."
            else
                DOCKERHUB_PROJECT_NAME=$(echo "${DOCKERHUB_PROJECT_NAME}" | tr '[:upper:]' '[:lower:]')
                echo "export DOCKERHUB_PROJECT_NAME=${DOCKERHUB_PROJECT_NAME}" >> ${BASH_ENV}
                echo "Overwrite DOCKERHUB_PROJECT_NAME with ${DOCKERHUB_PROJECT_NAME}."
            fi
      - run:
          name: Tag Docker Container Images for release and publish to DockerHub
          command: |
            GRAFANA_PLUGIN_IMAGE_NAME="$(cat ./opennms-grafana-plugin-docker-image-name.txt)"
            docker tag "${GRAFANA_PLUGIN_IMAGE_NAME}" ${DOCKERHUB_PROJECT_USER}/${DOCKERHUB_PROJECT_NAME}:$(.circleci/get-version.sh)
            docker tag "${GRAFANA_PLUGIN_IMAGE_NAME}" ${DOCKERHUB_PROJECT_USER}/${DOCKERHUB_PROJECT_NAME}:latest
            docker push ${DOCKERHUB_PROJECT_USER}/${DOCKERHUB_PROJECT_NAME}:$(.circleci/get-version.sh)
            docker push ${DOCKERHUB_PROJECT_USER}/${DOCKERHUB_PROJECT_NAME}:latest

  publish-docker-image-bleeding:
    executor: node-executor
    resource_class: small
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: ~/
      - docker-registry-login
      - run:
          name: Load Docker Container Image file
          command: |
            docker image load -q -i ./artifacts/opennms-grafana-plugin.oci | grep 'Loaded image:' | cut -d: -f2- | xargs > ./opennms-grafana-plugin-docker-image-name.txt
      - run:
          name: Set DockerHub organization and ensure lower case
          command: |
            if [ -z ${DOCKERHUB_PROJECT_USER+x} ]; then
                DOCKERHUB_PROJECT_USER=$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]')
                echo "export DOCKERHUB_PROJECT_USER=${DOCKERHUB_PROJECT_USER}" >> ${BASH_ENV}
                echo "Use CIRCLE_PROJECT_USERNAME instead which is set to ${DOCKERHUB_PROJECT_USER}."
            else
                DOCKERHUB_PROJECT_USER=$(echo "${DOCKERHUB_PROJECT_USER}" | tr '[:upper:]' '[:lower:]')
                echo "export DOCKERHUB_PROJECT_USER=${DOCKERHUB_PROJECT_USER}" >> ${BASH_ENV}
                echo "Overwrite DOCKERHUB_PROJECT_USER with ${DOCKERHUB_PROJECT_USER}."
            fi
      - run:
          name: Set DockerHub project name and ensure lower case
          command: |
            if [ -z ${DOCKERHUB_PROJECT_NAME+x} ]; then
                DOCKERHUB_PROJECT_NAME=$(echo "${CIRCLE_PROJECT_REPONAME}" | tr '[:upper:]' '[:lower:]')
                echo "export DOCKERHUB_PROJECT_NAME=${DOCKERHUB_PROJECT_NAME}" >> ${BASH_ENV}
                echo "Use CIRCLE_PROJECT_REPONAME instead which is set to ${DOCKERHUB_PROJECT_NAME}."
            else
                DOCKERHUB_PROJECT_NAME=$(echo "${DOCKERHUB_PROJECT_NAME}" | tr '[:upper:]' '[:lower:]')
                echo "export DOCKERHUB_PROJECT_NAME=${DOCKERHUB_PROJECT_NAME}" >> ${BASH_ENV}
                echo "Overwrite DOCKERHUB_PROJECT_NAME with ${DOCKERHUB_PROJECT_NAME}."
            fi
      - run:
          name: Tag Docker Container Images for bleeding and publish to DockerHub
          command: |
            GRAFANA_PLUGIN_IMAGE_NAME="$(cat ./opennms-grafana-plugin-docker-image-name.txt)"
            docker tag "${GRAFANA_PLUGIN_IMAGE_NAME}" ${DOCKERHUB_PROJECT_USER}/${DOCKERHUB_PROJECT_NAME}:bleeding
            docker push ${DOCKERHUB_PROJECT_USER}/${DOCKERHUB_PROJECT_NAME}:bleeding

  publish-rpm:
    executor: cloudsmith/default
    resource_class: small
    steps:
      - attach_workspace:
          at: ~/
      - cloudsmith/ensure-api-key
      - cloudsmith/install-cli
      - cloudsmith/publish:
          cloudsmith-repository: opennms/common-testing
          package-format: rpm
          package-distribution: any-distro/any-version
          package-path: artifacts/*.rpm

  publish-deb:
    executor: cloudsmith/default
    resource_class: small
    steps:
      - attach_workspace:
          at: ~/
      - cloudsmith/ensure-api-key
      - cloudsmith/install-cli
      - cloudsmith/publish:
          cloudsmith-repository: opennms/common-testing
          package-format: deb
          package-distribution: any-distro/any-version
          package-path: artifacts/*.deb

workflows:
  version: 2
  build-workflow:
    <<: *defaults
    jobs:
      - pre-build:
          filters:
            tags:
              only: /^v.*/
      - build:
          context: grafana
          requires:
            - pre-build
          filters:
            tags:
              only: /^v.*/
      - build-docs:
          requires:
            - pre-build
          filters:
            tags:
              only: /^v.*/
      # Runs alongside `build` rather than after it; the four make-* jobs below require
      # both, so nothing is packaged or GPG-signed from a tree with a failing suite.
      - verify:
          requires:
            - pre-build
          filters:
            tags:
              only: /^v.*/
      - create-merge-branch:
          context: grafana
          # these all imply "build", plus "make-docker-image" implies "make-tarball"
          requires:
            - make-deb
            - make-docker-image
            - make-rpm
            - make-zip
            - publish-deb
            - publish-docker-image-bleeding
            - publish-docker-image-latest
            - publish-rpm
          filters:
            branches:
              only:
                - /^release-.*/
                - develop
      - make-tarball:
          requires:
            - build
            - verify
          filters:
            tags:
              only: /^v.*/
      - make-docker-image:
          context:
            - "docker-publish-account"
          requires:
            - make-tarball
          filters:
            tags:
              only: /^v.*/
      - make-rpm:
          context:
            - "gpg-signing"
          requires:
            - build
            - verify
          filters:
            tags:
              only: /^v.*/
      - make-deb:
          context:
            - "gpg-signing"
          requires:
            - build
            - verify
          filters:
            tags:
              only: /^v.*/
      - make-zip:
          requires:
            - build
            - verify
          filters:
            tags:
              only: /^v.*/
      - validate-packages:
          context:
            - "gpg-signing"
            - "grafana"
          requires:
            - make-deb
            - make-docker-image
            - make-rpm
            - make-tarball
            - make-zip
          filters:
            tags:
              only: /^v.*/
      - publish-docker-image-latest:
          context:
            - "cloudsmith-publish-account"
            - "docker-publish-account"
          #  - "Service Principal"
          requires:
            - validate-packages
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - publish-docker-image-bleeding:
          context:
            - "cloudsmith-publish-account"
            - "docker-publish-account"
          #  - "Service Principal"
          requires:
            - validate-packages
          filters:
            branches:
              only: master
            tags:
              ignore: /^v.*/
      - publish-deb:
          context:
            - "cloudsmith-publish-account"
          requires:
            - validate-packages
          filters:
            branches:
              only:
                - develop
            tags:
              ignore: /^v.*/
      - publish-rpm:
          context:
            - "cloudsmith-publish-account"
          requires:
            - validate-packages
          filters:
            branches:
              only:
                - develop
            tags:
              ignore: /^v.*/
