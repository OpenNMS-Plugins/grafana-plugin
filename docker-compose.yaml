version: '3.0'

services:
  grafana:
    container_name: 'opennms-grafana-plugin'
    build:
      context: ./.config
      args:
        grafana_version: ${GRAFANA_VERSION:-12.4.0}
    ports:
      - 3000:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/opennms-opennms-app
      - ./provisioning:/etc/grafana/provisioning
